<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance System - Reports</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="robot-sidebar mb-4">
                        <div class="robot-mini">
                            <div class="robot-head-mini">
                                <div class="robot-eyes-mini">
                                    <div class="eye-mini left"></div>
                                    <div class="eye-mini right"></div>
                                </div>
                            </div>
                        </div>
                        <h5 class="text-light text-center">AttendBot</h5>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-speedometer2 me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sections.html">
                                <i class="bi bi-grid me-2"></i>
                                Manage Sections
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="reports.html">
                                <i class="bi bi-file-earmark-text me-2"></i>
                                Reports
                            </a>
                        </li>
                        <li class="nav-item mt-5">
                            <a class="nav-link" href="#" id="logoutBtn">
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Attendance Reports</h1>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Generate Monthly Report</h5>
                    </div>
                    <div class="card-body">
                        <form id="reportForm" class="row g-3">
                            <div class="col-md-4">
                                <label for="sectionSelect" class="form-label">Select Section</label>
                                <select class="form-select" id="sectionSelect" required>
                                    <option value="">Choose a section...</option>
                                    <!-- Sections will be loaded here -->
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="monthSelect" class="form-label">Select Month</label>
                                <select class="form-select" id="monthSelect" required>
                                    <option value="">Choose a month...</option>
                                    <option value="1">January</option>
                                    <option value="2">February</option>
                                    <option value="3">March</option>
                                    <option value="4">April</option>
                                    <option value="5">May</option>
                                    <option value="6">June</option>
                                    <option value="7">July</option>
                                    <option value="8">August</option>
                                    <option value="9">September</option>
                                    <option value="10">October</option>
                                    <option value="11">November</option>
                                    <option value="12">December</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="yearSelect" class="form-label">Select Year</label>
                                <select class="form-select" id="yearSelect" required>
                                    <option value="">Choose a year...</option>
                                    <option value="2023">2023</option>
                                    <option value="2024">2024</option>
                                    <option value="2025">2025</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-file-earmark-arrow-down me-1"></i> Generate Report
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>Report Preview</h5>
                        <button id="downloadReportBtn" class="btn btn-success" disabled>
                            <i class="bi bi-download me-1"></i> Download Report
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="reportPreview">
                            <div class="text-center text-muted py-5">
                                <i class="bi bi-file-earmark-text display-1"></i>
                                <p class="mt-3">Select a section and month to generate a report</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/reports.js"></script>
</body>
</html>
